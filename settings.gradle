pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'com.android') {
                useModule('com.android.tools.build:gradle:8.13.2')
            }
        }
    }
}

plugins {
    id "com.gradle.develocity" version "4.4.1"
}

develocity {
    buildScan {
        termsOfUseUrl = "https://gradle.com/terms-of-service"
        termsOfUseAgree = "yes"
        publishing.onlyIf { System.getenv("GITHUB_ACTIONS")?.toBoolean() == true }
    }
}

def d2v = [

        "axis",
        "chord",
        "color",
        "contour",
        "core",
        "delaunay",
        "dsv",
        "ease",
        "force",
        "format",
        "geo",
        "hexbin",
        "hierarchy",
        "interpolate",
        "quadtree",
        "random",
        "sankey",
        "scale",
        "shape",
        "tests",
        "tile",
        "time",
        "time-format",
        "timer",
        "transition",
        "viz",
        "voronoi"

]

System.setProperty("all_d2v", d2v.join(","))
d2v.forEach {
    println it
    def included = includeAndFilter(it)
    if (included)
        project(":$it").name = "d2v-${it}"

}


