plugins {
    id 'com.android.kotlin.multiplatform.library' version '9.1.1' apply(false)
    id "org.jetbrains.kotlin.multiplatform" version "2.3.20" apply(false)
    id 'org.jetbrains.dokka' version "2.2.0"
}

final String thisLibraryVersion = file("libraries_version.txt").readLines().first()

allprojects {

    group = "io.data2viz.d2v"
    version = thisLibraryVersion

    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven {
            url "https://maven.pkg.jetbrains.space/data2viz/p/maven/public"
            content {
                includeGroup "io.data2viz.geojson"
            }
        }
    }
}


// --------------- Configure sub-projects that are published ---------------

subprojects {
    apply from: rootProject.file("gradle/publish.gradle")
}
